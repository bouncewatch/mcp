name: publish

# Trusted publishing (OIDC), not a stored token.
#
# npm is restricting tokens that bypass 2FA — account changes landed August 2026,
# direct publishing follows in January 2027 — so there is deliberately no
# NPM_TOKEN here and nothing to leak or rotate. GitHub mints a short-lived
# credential for this one workflow in this one repository.
#
# Two things must NOT come back:
#   --provenance     — trusted publishing attaches provenance on its own
#   NODE_AUTH_TOKEN  — its presence sends npm down the legacy token path instead
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # The runner's bundled npm predates trusted publishing. npm 12 needs
      # Node 22 or newer — hence the version above; on Node 20 this install fails
      # outright with EBADENGINE.
      - run: npm install -g npm@latest
      # Globbed, not `--test test/`. Node stopped treating a bare directory as a
      # search root and now tries to load it as a module, so the directory form
      # fails outright on the version pinned above. This workflow has never run
      # — 1.2.0 was published by hand, because npm will not enable trusted
      # publishing for a package that does not exist yet — so the break was
      # sitting here unhit, waiting for the first release to use it.
      - run: node --test test/*.test.js
      - run: npm publish --access public
